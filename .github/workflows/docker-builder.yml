name: Publish Docker Image
run-name: ${{ github.repository }} is building and publishing a docker image
on:
  release:
    types: [ published ]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment_tag:
        description: 'Additional environment tag (dev, staging, rc, stable)'
        required: false
        type: choice
        options:
          - 'none'
          - 'dev'
          - 'staging'
          - 'rc'
          - 'stable'
        default: 'none'
      version_tag:
        description: 'Optional version tag to add to the image (e.g., 2.2.0)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_VERSION_TAG: ${{ github.event_name == 'release' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version_tag || 'main') }} # var to determine the correct tag in normal pull request merge when no version is set

# Github documentation
jobs:
  # ==========================================================================
  # Job: build-application
  # Description: Builds and tests the Maven project once and provides the
  #              application JAR to both image build jobs as a run-scoped
  #              artifact.
  # ==========================================================================
  build-application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Cache PGP keys for pgpverify-maven-plugin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/pgpkeys-cache
          key: pgp-keys-${{ hashFiles('pgp/keys.list') }}
          restore-keys: pgp-keys-
      - name: Build with Maven
        run: mvn --batch-mode clean generate-resources install
      - name: Upload application JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifier-application-jar
          path: verifier-application/target/*.jar
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # Job: publish-hardened-image
  # Description: Downloads this run's application JAR and builds/pushes the
  #              default hardened image in parallel with the unhardened image.
  # ==========================================================================
  publish-hardened-image:
    needs: build-application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push-dhi.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download application JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verifier-application-jar
          path: verifier-application/target/
      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata (hardened, default)
        id: meta-dhi
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Disable latest tag
          flavor: |
            latest=false
          # Additional tags (branch / release tag / commit SHA / environment tags)
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.environment_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.environment_tag != 'none' }}
            type=raw,value=${{ inputs.version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' }}
      - name: Build and push hardened (default) docker image
        id: push-dhi
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          provenance: mode=max
          sbom: true
          push: true
          pull: true
          tags: ${{ steps.meta-dhi.outputs.tags }}
          labels: ${{ steps.meta-dhi.outputs.labels }}
          file: Dockerfile.dhi

  # ==========================================================================
  # Job: publish-unhardened-image
  # Description: Downloads this run's application JAR and builds/pushes the
  #              transitional UBI image in parallel with the hardened image.
  # ==========================================================================
  publish-unhardened-image:
    needs: build-application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push-unhardened.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download application JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verifier-application-jar
          path: verifier-application/target/
      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata (unhardened)
        id: meta-unhardened
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-unhardened
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.environment_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.environment_tag != 'none' }}
            type=raw,value=${{ inputs.version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != '' }}
      - name: Build and push unhardened docker image
        id: push-unhardened
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          provenance: mode=max
          sbom: true
          push: true
          pull: true
          tags: ${{ steps.meta-unhardened.outputs.tags }}
          labels: ${{ steps.meta-unhardened.outputs.labels }}
          build-args: SOURCE_IMAGE=eclipse-temurin:25-jre-ubi10-minimal
          file: Dockerfile

  # ==========================================================================
  # Job: sign-published-images
  # Description: Waits for both image variants and signs both immutable
  #              digests together, preserving the previous all-or-nothing gate.
  # ==========================================================================
  sign-published-images:
    needs: [publish-hardened-image, publish-unhardened-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign published images with Cosign
        env:
          COSIGN_YES: "true"
          HARDENED_DIGEST: ${{ needs.publish-hardened-image.outputs.digest }}
          UNHARDENED_DIGEST: ${{ needs.publish-unhardened-image.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "Signing hardened image ${IMAGE}@${HARDENED_DIGEST}"
          cosign sign --recursive "${IMAGE}@${HARDENED_DIGEST}"
          echo "Signing unhardened image ${IMAGE}@${UNHARDENED_DIGEST}"
          cosign sign --recursive "${IMAGE}@${UNHARDENED_DIGEST}"

  # ==========================================================================
  # Job: monitor-code
  # Description: Monitors Maven dependencies after both images were published
  #              and signed, while image monitors and SBOM run in parallel.
  # ==========================================================================
  monitor-code:
    needs: sign-published-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Install Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # latest on master
      - name: Monitor Snyk for vulnerabilities in code 📦
        run: snyk monitor --maven-aggregate-project --severity-threshold=high --project-tags:app-name=swiyu-verifier,version=${{ env.IMAGE_VERSION_TAG }} --target-reference=${{ github.ref_name }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.eu.snyk.io
          SNYK_ORG: ${{ secrets.SNYK_ORG }}

  # ==========================================================================
  # Job: monitor-hardened-image
  # Description: Monitors the published hardened image in Snyk.
  # ==========================================================================
  monitor-hardened-image:
    needs: sign-published-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Monitor Snyk for vulnerabilities in hardened image 🐳
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: monitor
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION_TAG }}
          args: --project-name=swiyu-verifier --project-tags:app-name=swiyu-verifier,version=${{ env.IMAGE_VERSION_TAG }} --target-reference=${{ github.ref_name }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.eu.snyk.io
          SNYK_ORG: ${{ secrets.SNYK_ORG }}

  # ==========================================================================
  # Job: monitor-unhardened-image
  # Description: Monitors the published transitional UBI image in Snyk.
  # ==========================================================================
  monitor-unhardened-image:
    needs: sign-published-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Monitor Snyk for vulnerabilities in unhardened image 🐳
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          command: monitor
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION_TAG }}-unhardened
          args: --severity-threshold=high --project-name=swiyu-verifier-unhardened --project-tags:app-name=swiyu-verifier-unhardened,version=${{ env.IMAGE_VERSION_TAG }}-unhardened --target-reference=${{ github.ref_name }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.eu.snyk.io
          SNYK_ORG: ${{ secrets.SNYK_ORG }}

  # ==========================================================================
  # Job: create-sbom
  # Description: Creates the same Maven CycloneDX SBOM and attaches it to a
  #              GitHub release while all Snyk monitor jobs run in parallel.
  # ==========================================================================
  create-sbom:
    needs: sign-published-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Install Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # latest on master
      - name: Create SBOM
        run: snyk sbom --format=cyclonedx1.6+json --maven-aggregate-project --json-file-output=sbom.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.eu.snyk.io
          SNYK_ORG: ${{ secrets.SNYK_ORG }}
      - name: Upload SBOM to release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
          "${{ env.IMAGE_VERSION_TAG }}" \
          sbom.json