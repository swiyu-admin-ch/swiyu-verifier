name: Pull Request Check
run-name: ${{ github.repository }} is evaluating pull request
on: [ pull_request ]

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs build/load local images (no push) and upload SARIF,
# write the coverage summary to the job summary, and do not publish packages or
# create attestations.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ==========================================================================
  # Job: build-and-test
  # Description: Builds once, runs unit/integration tests + JaCoCo, and
  #              generates the OpenAPI spec (reusing the already-compiled
  #              classes instead of a second `clean verify`). This job is the
  #              only one that produces the runnable JAR, which the docker-*
  #              jobs download as an artifact instead of rebuilding it
  #              themselves.
  # ==========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Cache PGP keys for pgpverify-maven-plugin
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository/pgpkeys-cache
          key: pgp-keys-${{ hashFiles('pgp/keys.list') }}
          restore-keys: pgp-keys-

      - name: Build & test with Maven (produce JaCoCo)
        run: mvn --batch-mode clean verify -DskipTests=false

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: jacoco-reports
          path: |
            verifier-service/target/site/jacoco/jacoco.xml
            verifier-service/target/site/jacoco/index.html
            verifier-application/target/site/jacoco/jacoco.xml
            verifier-application/target/site/jacoco/index.html

      - name: Setup Node.js (for coverage summary script)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Add coverage to summary
        run: node .github/scripts/coverage-summary.js

      # "if-no-files-found: error" is important: the default is "warn", which
      # would let this job succeed without an artifact and make the dependent
      # docker jobs fail later with a confusing "artifact not found" error.
      - name: Upload application JAR (for docker build jobs)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verifier-application-jar
          path: verifier-application/target/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Generate OpenAPI spec
        run: mvn -B verify -P generate-doc -DskipTests

      - name: Ensure spec is committed
        run: |
          git diff --exit-code -- openapi.yaml || (
            echo "openapi.yaml is outdated. Run: mvn verify -P generate-doc and commit the updated file."
            exit 1
          )

  # ==========================================================================
  # Job: codeql-analysis
  # Description: Runs in parallel to build-and-test. CodeQL requires
  #              build-mode "manual" (see codeql-config.yml), so it needs its
  #              own traced build - but only a plain `compile` (no tests, no
  #              jacoco) is required for the analysis, which is considerably
  #              faster than the full `clean verify` used for build-and-test.
  # ==========================================================================
  codeql-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: java
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Cache PGP keys for pgpverify-maven-plugin
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository/pgpkeys-cache
          key: pgp-keys-${{ hashFiles('pgp/keys.list') }}
          restore-keys: pgp-keys-

      - name: Compile sources for CodeQL tracing
        # "test-compile" (not just "compile") so that test sources are compiled
        # and therefore still analysed by CodeQL, exactly as with the previous
        # `clean verify`. -DskipTests only skips test *execution*, not test
        # compilation, so no tests are run twice.
        run: mvn --batch-mode clean test-compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:java"

  # ==========================================================================
  # Job: pmd-scan
  # Description: Independent static analysis, runs in parallel - PMD only
  #              needs the sources, not a Maven build.
  # ==========================================================================
  pmd-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # PMD needs a JRE to run.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Run PMD static analysis
        uses: pmd/pmd-github-action@d9c1f3c5940cbf5923f1354e83fa858b4496ebaa # v2
        id: pmd
        with:
          rulesets: '.github/rulesets/java/pmd_omni_ruleset.xml'
          cache: true

      - name: Upload PMD SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: pmd-report.sarif

  # ==========================================================================
  # Job: snyk-maven-scan
  # Description: Independent dependency vulnerability scan, runs in parallel -
  #              only needs dependency resolution, not a full build.
  # ==========================================================================
  snyk-maven-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Cache PGP keys for pgpverify-maven-plugin
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository/pgpkeys-cache
          key: pgp-keys-${{ hashFiles('pgp/keys.list') }}
          restore-keys: pgp-keys-

      - name: Install Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # latest on master

      - name: Run Snyk to check for vulnerabilities 🔍
        run: snyk test --maven-aggregate-project --severity-threshold=high --sarif-file-output=snyk.sarif
        continue-on-error: false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.eu.snyk.io
          SNYK_ORG: ${{ secrets.SNYK_ORG }}

      - name: Upload result as sarif to GitHub Code Scanning 📦
        if: always() # We want to upload the SARIF file even if the Snyk action fails, to have the results in the Code Scanning tab of GitHub
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: snyk.sarif

  # ==========================================================================
  # Job: docker-hardened
  # Description: The hardened dhi.io image is the default published variant.
  #              Runs in parallel with docker-unhardened - both only need the
  #              JAR from build-and-test, not each other.
  # ==========================================================================
  docker-hardened:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download application JAR
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verifier-application-jar
          path: verifier-application/target/

      - name: Build hardened (default) docker image
        id: build-dhi
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          pull: true # Prevent old images to be used, which may trigger CVE findings
          tags: pull_request_check:latest
          file: Dockerfile.dhi

      - name: Scan hardened Docker image with Snyk 🐳
        uses: snyk/actions/docker@8e119fbb6c251787721d34ba683ed48eba792766 # master
        continue-on-error: false
        with:
          # report only vulnerabilities with level high or critical, as we want to avoid noise in the PR checks
          image: pull_request_check:latest
          args: --file=Dockerfile.dhi --severity-threshold=high --exclude-base-image-vulns
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.eu.snyk.io
          SNYK_ORG: ${{ secrets.SNYK_ORG }}

  # ==========================================================================
  # Job: docker-unhardened
  # Description: The UBI image, published under -unhardened during the
  #              transition period. Runs in parallel with docker-hardened.
  # ==========================================================================
  docker-unhardened:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download application JAR
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verifier-application-jar
          path: verifier-application/target/

      - name: Build unhardened docker image
        id: build-unhardened
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          tags: pull_request_check:unhardened
          build-args: SOURCE_IMAGE=eclipse-temurin:25-jre-ubi10-minimal
          file: Dockerfile

      - name: Scan unhardened Docker image with Snyk 🐳
        uses: snyk/actions/docker@8e119fbb6c251787721d34ba683ed48eba792766 # master
        continue-on-error: false
        with:
          image: pull_request_check:unhardened
          args: --file=Dockerfile --severity-threshold=high --exclude-base-image-vulns
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.eu.snyk.io
          SNYK_ORG: ${{ secrets.SNYK_ORG }}

  # ==========================================================================
  # Job: ai-code-review
  # Description: Independent, runs in parallel with all other jobs. Generates
  #              the diff against the PR base branch and posts an AI-assisted
  #              code review as a job summary and PR comment.
  # ==========================================================================
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # We need permissions to leave a comment on the PR
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # IMPORTANT: 0 fetches the full git history, which is required for the diff

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: pip install langgraph langchain-openai pydantic

      - name: Run AI Review Agent
        env:
          ADESSO_API_KEY: ${{ secrets.ADESSO_API_KEY }}
          # These variables can be defined directly here
          ADESSO_BASE_URL: "https://adesso-ai-hub.3asabc.de/v1"
          LLM_MODEL_NAME: "claude-sonnet-5*"
          # Tells the script which branch the PR targets (e.g. origin/main)
          GIT_DIFF_TARGET: "origin/${{ github.base_ref }}...HEAD"
        run: |
          # Run the script
          python .github/agent/ai-review-agent/review_agent_openai.py

      - name: Add Report to Job Summary
        # Shows the result on the GitHub Actions summary page
        if: always()
        run: |
          if [ -f ai-review-report.md ]; then
            cat ai-review-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Report as PR Comment
        # Posts the result directly as a comment on the pull request
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ai-review-report.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file ai-review-report.md
          fi